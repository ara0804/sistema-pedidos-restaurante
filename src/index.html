<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Cliente</title>
</head>
<body>
    <header>
        <h1>Menú Digital</h1>
        <label for="mesa">Mesa N°:</label>
        <input type="number" id="mesa" name="mesa" required>
    </header>
    <main>
        <section id="catalogo">
            <h2>Nuestros Platos</h2>
            <!-- Productos base para la maqueta visual -->
            <div class="producto-item">
                <h3>Hamburguesa Clásica</h3>
                <p>Precio: $15.00</p>
                <button>Añadir (Simulación)</button>
            </div>
        </section>
        <aside id="carrito-compras">
            <h2>Tu Pedido</h2>
            <p>Total: $0.00</p>
            <button>Enviar a Cocina</button>
        </aside>
    </main>
</body>
</html>
