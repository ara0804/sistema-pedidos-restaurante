<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Caja</title>
</head>
<body>
    <header>
        <h1>Facturación y Cobro</h1>
    </header>
    <main>
        <label for="buscar-mesa">Buscar Mesa:</label>
        <input type="number" id="buscar-mesa" placeholder="N° de Mesa">
        <button>Buscar</button>
        
        <div id="resumen-cobro">
            <h2>Total a Pagar: $0.00</h2>
            <button>Registrar Pago y Liberar Mesa</button>
        </div>
    </main>
</body>
</html>
